[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chimera-inference"
version = "0.1.0"
description = "SOTA Heterogeneous LLM Inference Engine & OpenAI REST Server optimized for NVIDIA RTX 3050 Laptop (4GB VRAM) and Intel Core i5-12500H AVX2 P-cores"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sebastian Kurniawan Windu Wiwaha", email = "sebastianCodeNew@users.noreply.github.com" }
]
dependencies = [
    "torch>=2.4.0",
    "numpy>=1.26.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
